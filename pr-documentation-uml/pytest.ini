[pytest]
# Pytest configuration for PR Documentation with UML skill

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    basic: Basic class analysis tests
    inheritance: Inheritance analysis tests
    decorators: Decorator and property analysis tests
    integration: Integration tests

